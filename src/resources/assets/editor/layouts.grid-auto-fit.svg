<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180">
    <style>
        .s0 { fill: var(--neutral-100, transparent); stroke: var(--neutral-800, #d4d4d4); stroke-width: 2; }
        .title-text {
            font-size: 14px;
            color: var(--neutral-800);
            font-weight: 700;
            text-align: left;
            text-transform: initial;
        }
        .card-bg {
            fill: var(--neutral-200, #fff);
            stroke: var(--neutral-800, #d4d4d4);
            stroke-width: 1;
        }
        .card-title {
            font-size: 10px;
            color: var(--neutral-800);
            font-weight: 600;
            text-align: left;
            text-transform: initial;
        }
        .card-text {
            font-size: 8px;
            color: var(--neutral-800);
            font-weight: 400;
            line-height: 1.4;
            text-align: justify;
            text-transform: initial;
        }
        .s2 { fill: var(--primary-400, #000) }
        .button-text {
            font-size: 9px;
            color: var(--neutral-1000, #fff);
            font-weight: 700;
        }
    </style>

    <!-- Background principal -->
    <path fill-rule="evenodd" class="s0"
          d="m5 0h270c2.76 0 5 2.24 5 5v170c0 2.76-2.24 5-5 5h-270c-2.76 0-5-2.24-5-5v-170c0-2.76 2.24-5 5-5z"/>

    <!-- Titre -->
    <foreignObject x="15" y="20" width="250" height="25">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <div class="title-text">My great title</div>
        </div>
    </foreignObject>

    <!-- Item 1 (haut gauche) - Carte avec texte -->
    <rect x="15" y="45" width="125" height="55" rx="4" class="card-bg"/>
    <foreignObject x="20" y="50" width="115" height="45">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; flex-direction: column; gap: 4px;">
            <div class="card-title">Card Title</div>
            <div class="card-text">Short description text</div>
        </div>
    </foreignObject>

    <!-- Item 2 (haut droite) - Image placeholder -->
    <rect x="145" y="45" width="125" height="55" rx="4" class="card-bg"/>
    <foreignObject x="145" y="45" width="125" height="55">
        <div xmlns="http://www.w3.org/1999/xhtml" class="card-text" style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 10px;">
            📷 Image
        </div>
    </foreignObject>

    <!-- Item 3 (bas gauche) - Bouton/CTA -->
    <rect x="15" y="110" width="125" height="55" rx="4" class="s2"/>
    <foreignObject x="15" y="110" width="125" height="55">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%;">
            <div class="button-text">Call to Action</div>
        </div>
    </foreignObject>

    <!-- Item 4 (bas droite) - Liste simple -->
    <rect x="145" y="110" width="125" height="55" rx="4" class="card-bg"/>
    <foreignObject x="150" y="115" width="115" height="45">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 8px; color: var(--neutral-800); line-height: 1.6;">
            • List item one<br/>
            • List item two<br/>
            • List item three
        </div>
    </foreignObject>
</svg>